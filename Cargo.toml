[package]
name = "mdbook-llms"
version = "0.3.0"
edition = "2024"
description = "mdBook 0.5 renderer that generates llms.txt, llms-full.txt and per-page Markdown"
license = "MIT"
repository = "https://github.com/ttdonovan/mdbook-llms"
homepage = "https://ttdonovan.github.io/mdbook-llms/"
keywords = ["mdbook", "llms", "llms-txt", "documentation"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
anyhow = "1"
mdbook-markdown = "0.5"
mdbook-preprocessor = "0.5"
mdbook-renderer = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
