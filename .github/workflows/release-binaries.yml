name: Release binaries

# Builds both binaries for each platform and attaches archives and SHA-256 files to a GitHub Release.
# Called by release-plz after it tags a release. Run it by hand to backfill an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v0.4.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.4.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build
        run: cargo build --release --locked

      # Archive layout: both binaries at the top level, named mdbook-llms-<tag>-<target>
      - name: Package
        shell: bash
        run: |
          name="mdbook-llms-$TAG-$TARGET"
          mkdir "$name"
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          cp "target/release/mdbook-llms$ext" "target/release/mdbook-strip-frontmatter$ext" LICENSE README.md "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            asset="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
